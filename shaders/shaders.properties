# ReMorganShaded v1.0 - Shaders Properties
# Otimizado para GTX 750 Ti (2GB VRAM) - 70-80+ FPS em 1080p

# Shadow Map Configuration
shadowResX=2048
shadowResY=2048
shadowDistance=6.0
shadowDistanceRenderMul=1.0

# Buffers - Mínimo necessário para performance
bufferProgram0=composite
bufferProgram1=composite1
bufferProgram2=composite2
bufferProgram3=final

# Render Resolution Options
underwaterOverlay=0
volumetricLight=1

# Shadow Settings
shadowMapFilter=1
shadowtex0Mipmap=true
shadowtex1Mipmap=false
shadowColor0Mipmap=false
shadowColor1Mipmap=false

# Depth Buffer
depthBufferClear=true

# Color Buffers
colorBuffer0=true
colorBuffer1=true
colorBuffer2=true
colorBuffer3=true

# Sliders para ajuste de qualidade/performance
sliders=
{
    slider.shadowRes {
        label=Shadow Resolution
        values=[1024, 2048]
        value=2048
    }
    slider.shadowDist {
        label=Shadow Distance
        values=[4, 5, 6, 8]
        value=6
    }
    slider.ssaoQuality {
        label=SSAO Quality
        values=[OFF, LOW, MEDIUM, HIGH]
        value=MEDIUM
    }
    slider.reflectionQuality {
        label=Reflection Quality
        values=[OFF, LOW, MEDIUM]
        value=MEDIUM
    }
    slider.bloomStrength {
        label=Bloom Strength
        values=[0.0, 0.5, 1.0, 1.5, 2.0]
        value=1.0
    }
    slider.motionBlur {
        label=Motion Blur
        values=[OFF, ON]
        value=ON
    }
    slider.dof {
        label=Depth of Field
        values=[OFF, ON]
        value=OFF
    }
}

# Profile definitions
profile.ULTRA=shadowRes:2048 shadowDist:6 ssaoQuality:HIGH reflectionQuality:MEDIUM bloomStrength:1.5
profile.HIGH=shadowRes:2048 shadowDist:6 ssaoQuality:MEDIUM reflectionQuality:MEDIUM bloomStrength:1.0
profile.MEDIUM=shadowRes:1024 shadowDist:5 ssaoQuality:LOW reflectionQuality:LOW bloomStrength:0.8
profile.LOW=shadowRes:1024 shadowDist:4 ssaoQuality:OFF reflectionQuality:OFF bloomStrength:0.5

# World-specific settings
world0.profile=HIGH
world-1.profile=MEDIUM
world1.profile=LOW

# Disable expensive features by default for 750 Ti
oldLighting=false
oldHandLighting=false
backface.shadow=true
sunPathRotation=0.0
