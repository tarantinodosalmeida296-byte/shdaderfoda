# ReMorganShaded v1.0 - World-1 (Nether) Configuration
# Configurações simplificadas para o Nether

# Dimensão
dimension0=-1

# Perfil de qualidade para Nether (reduzido para performance)
profile=MEDIUM

# Desativar efeitos não necessários no Nether
enableSun=false
enableMoon=false
enableStars=false
enableClouds=false
enableRain=false
enableSnow=false

# Configurações de iluminação
ambientLight=0.2
sunIntensity=0.0
moonIntensity=0.0

# Cor do fog do Nether
fogColor=0.3,0.05,0.05
fogDensity=0.008

# Iluminação emissiva dos blocos de lava
lavaBrightness=1.0

# Sem sombras no Nether (performance)
disableShadows=true
